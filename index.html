er-radius:16px;width:90%;max-width:400px;text-align:center}</style></head><body><div id="loginOverlay"><div class="loginBox"><h2>🔒 BILOBA</h2><input type="text" id="loginUser" placeholder="Usuario"><br><br><input type="password" id="loginPass" placeholder="Contraseña"><button id="btnLogin" class="btnG">Entrar</button><div id="loginError" style="color:red;font-weight:bold;margin-top:10px;display:none">Incorrecto</div></div></div><div class="card" id="mainContent" style="display:none"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">BILOBA</h2><button id="btnLogout" style="background:#dc2626;color:#fff;padding:8px 12px;border:0;border-radius:8px;font-weight:bold;cursor:pointer">Cerrar sesión</button></div><div class="box ok" style="background:#fff8d6;border:3px solid #e6a800"><b>NOMBRE PACIENTE</b><br><br><input type="text" id="nombrePaciente" placeholder="Ej: SANTILLAN LUCAS"><div id="nombrePreview" style="margin-top:8px;padding:8px;background:#e8f5e9;border-radius:6px;font-weight:bold;display:none"></div></div><div class="box ok"><b>1) RESUMEN</b> <input type="file" id="inResumen" accept=".pdf"><div id="stResumen"></div></div><div class="box ok"><b>2) ADMISION</b> <input type="file" id="inAdmision" accept=".pdf"><div id="stAdmision"></div></div><div class="box ok"><b>3) INDICACION</b> <input type="file" id="inIndicacion" accept=".pdf"><div id="stIndicacion"></div></div><div class="box ok"><b>4) PDF 4 PAGINAS</b> <input type="file" id="in4Pag" accept=".pdf"><div id="st4Pag"></div></div><div style="margin-top:12px;background:#fff;border:2px solid #111;padding:10px;border-radius:10px"><b>ORDEN:</b><div id="ordenTodas" style="margin-top:6px;font-size:14px;line-height:1.6"></div><div id="stFijas" style="font-size:12px;margin-top:8px;font-weight:bold"></div></div><select id="selDocVisor" style="padding:14px;border-radius:8px;width:100%;font-size:17px;margin:10px 0;font-weight:bold;border:3px solid #0a7d2e;background:#e8f5e9"></select><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btnS active" data-f="0">Firma Caprarella</button><button class="btnS" data-f="1">Firma Orellana</button><button class="btnS" data-f="2">Firma Pablo P.</button><button class="btnS" id="btnAddCentro" style="background:#0a7d2e;color:#fff">+ PONER FIRMA</button><button class="btnS" id="btnP4Centro" style="background:#111;color:#fff">📍 P4 AUTO</button></div><div class="panel"><button class="btnS" id="btnLeft">◀</button><button class="btnS" id="btnRight">▶</button><button class="btnS" id="btnUp">▲</button><button class="btnS" id="btnDown">▼</button><button class="btnS" id="btnChica">-</button><input type="range" id="rangeW" min="20" max="500" value="150" style="width:120px"><button class="btnS" id="btnGrande">+</button><span id="lblW" style="font-weight:bold">150px</span><button class="btnS" id="btnBorrarUna" style="background:#dc2626;color:#fff">Borrar</button></div><div class="canvasWrap" id="wrap"><canvas id="pdfCanvas"></canvas></div><canvas id="hiddenCanvas" style="display:none"></canvas><div id="status" style="font-weight:bold;white-space:pre-wrap;margin-top:8px"></div><button id="btnFinal" class="btnG">⬇️ DESCARGAR BILOBA - MAX 1,69MB ALTA CALIDAD</button></div><script>
const LOGIN={usuario:"bilobaneuro",password:"sanmartinvergara"};const loginOverlay=document.getElementById('loginOverlay'),mainContent=document.getElementById('mainContent');function checkLogin(){if(location.search.includes('logout')){localStorage.clear();history.replaceState({},'',location.pathname);}if(localStorage.getItem('biloba_auth')==='ok'){loginOverlay.style.display='none';mainContent.style.display='block';}}document.getElementById('btnLogin').addEventListener('click',()=>{let u=document.getElementById('loginUser').value.trim(),p=document.getElementById('loginPass').value.trim();if(u===LOGIN.usuario&&p===LOGIN.password){localStorage.setItem('biloba_auth','ok');loginOverlay.style.display='none';mainContent.style.display='block';}else{document.getElementById('loginError').style.display='block';}});checkLogin();document.getElementById('btnLogout').addEventListener('click',()=>{localStorage.clear();location.reload();});
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const NOMBRES={"p1":"1. P1","p2":"2. P2","resumen":"3. RESUMEN","indicacion":"4. INDICACION","admision":"5. ADMISION","planilla3_hoja1":"6. Hoja1","p3":"7. P3","planilla3_hoja3":"8. Hoja3","planilla3_hoja4":"9. Hoja4","p4":"10. P4"};const ORDEN=["p1","p2","resumen","indicacion","admision","planilla3_hoja1","p3","planilla3_hoja3","planilla3_hoja4","p4"];const SOLO_FIRMAR=["resumen","indicacion","admision","p4"];let firmas=[null,null,null],fijas={planilla3_hoja1:null,planilla3_hoja3:null,planilla3_hoja4:null},dinamicos=[],posiciones={},firmaActiva=0,selectedIdx=null,scale=1.5,pageW=0,pageH=0,ultimoNombre="";function buf2b64(b){let s='',u=new Uint8Array(b);for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}function b64ToU8(b){let bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}function saveAll(){localStorage.setItem('posV50',JSON.stringify(posiciones));localStorage.setItem('nombrePacV50',document.getElementById('nombrePaciente').value||'');}async function fetchToBase64(url){try{let r=await fetch(encodeURI(url));if(!r.ok)return null;let ab=await r.arrayBuffer();return buf2b64(ab);}catch(e){return null;}}async function fetchImg(url){try{let r=await fetch(encodeURI(url));if(!r.ok)return null;let b=await r.blob();return await new Promise(res=>{let fr=new FileReader();fr.onload=e=>res(e.target.result);fr.readAsDataURL(b);});}catch(e){return null;}}async function fetchTry(L,f){for(let u of L){let v=await f(u);if(v)return v;}return null;}async function recortarFirma(d){return new Promise(r=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas');c.width=im.width;c.height=im.height;let x=c.getContext('2d');x.fillStyle='#FFF';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0);let data=x.getImageData(0,0,c.width,c.height).data,minX=c.width,minY=c.height,maxX=0,maxY=0,f=false;for(let y=0;y<c.height;y++)for(let x2=0;x2<c.width;x2++){let i=(y*c.width+x2)*4;if(data[i]<235||data[i+1]<235||data[i+2]<235){if(x2<minX)minX=x2;if(y<minY)minY=y;if(x2>maxX)maxX=x2;if(y>maxY)maxY=y;f=true;}}if(!f){r(d);return;}let cw=maxX-minX+13,ch=maxY-minY+13,c2=document.createElement('canvas');c2.width=cw;c2.height=ch;let x3=c2.getContext('2d');x3.fillStyle='#FFF';x3.fillRect(0,0,cw,ch);x3.drawImage(c,Math.max(0,minX-6),Math.max(0,minY-6),cw,ch,0,0,cw,ch);r(c2.toDataURL('image/png'));};im.onerror=()=>r(d);im.src=d;});}
async function compPag(ab,idx,cal,esc){const doc=await pdfjsLib.getDocument({data:ab.slice(0)}).promise;const pg=await doc.getPage(idx+1);const vp=pg.getViewport({scale:esc});const cv=document.getElementById('hiddenCanvas');cv.width=vp.width;cv.height=vp.height;const ctx=cv.getContext('2d');ctx.fillStyle='#FFF';ctx.fillRect(0,0,cv.width,cv.height);await pg.render({canvasContext:ctx,viewport:vp}).promise;const jpg=cv.toDataURL('image/jpeg',cal);const {PDFDocument}=PDFLib;const np=await PDFDocument.create();const W=595.28,H=841.89;const jb=await fetch(jpg).then(r=>r.arrayBuffer());const ji=await np.embedJpg(jb);const pa=np.addPage([W,H]);const s=Math.min(W/vp.width*esc,H/vp.height*esc)*0.98;const w=vp.width/esc*s,h=vp.height/esc*s;pa.drawImage(ji,{x:(W-w)/2,y:(H-h)/2,width:w,height:h});return await np.save({useObjectStreams:true});}
async function compPdf(ab,cal,esc){const src=await pdfjsLib.getDocument({data:ab.slice(0)}).promise;const {PDFDocument}=PDFLib;const fin=await PDFDocument.create();for(let i=0;i<src.numPages;i++){let one=await compPag(ab,i,cal,esc);let d1=await PDFDocument.load(one);let [p]=await fin.copyPages(d1,[0]);fin.addPage(p);}return await fin.save({useObjectStreams:true});}
async function cargarFijas(){let sp=localStorage.getItem('posV50');posiciones=sp?JSON.parse(sp):{};fijas.planilla3_hoja1=await fetchTry(['./fijas/Planilla 3 hoja 1.pdf','./fijas/planilla 3 hoja 1.pdf','./fijas/Planilla 3 Hoja 1.pdf','./fijas/Planilla%203%20hoja%201.pdf','./fijas/planilla3_hoja1.pdf'],fetchToBase64);fijas.planilla3_hoja3=await fetchTry(['./fijas/Planilla 3 hoja 3.pdf','./fijas/planilla 3 hoja 3.pdf','./fijas/Planilla 3 Hoja 3.pdf','./fijas/Planilla 3 Hoja3.pdf','./fijas/planilla 3 hoja3.pdf','./fijas/Planilla%203%20hoja%203.pdf','./fijas/planilla 3 hoja 3.PDF','./fijas/PLANILLA 3 HOJA 3.pdf','./fijas/hoja 3.pdf','./fijas/Hoja 3.pdf','./fijas/planilla3_hoja3.pdf'],fetchToBase64);fijas.planilla3_hoja4=await fetchTry(['./fijas/Planilla 3 hoja 4.pdf','./fijas/planilla 3 hoja 4.pdf','./fijas/Planilla 3 Hoja 4.pdf','./fijas/Planilla%203%20hoja%204.pdf'],fetchToBase64);let f1=await fetchTry(['./firma/firma Caprarella.png','./firma/Firma Caprarella.png'],fetchImg);let f2=await fetchTry(['./firma/Firma Orellana.jpeg','./firma/firma Orellana.jpeg'],fetchImg);let f3=await fetchTry(['./firma/firma Pablo p.png','./firma/firma Pablo P.png'],fetchImg);if(f1)firmas[0]=await recortarFirma(f1);if(f2)firmas[1]=await recortarFirma(f2);if(f3)firmas[2]=await recortarFirma(f3);renderEstado();let np=localStorage.getItem('nombrePacV50');if(np){document.getElementById('nombrePaciente').value=np;ultimoNombre=np;actualizarPreviewNombre();}document.getElementById('stFijas').innerHTML=`Fijas: H1 ${fijas.planilla3_hoja1?'✅':'❌'} | H3 ${fijas.planilla3_hoja3?'✅':'❌'} | H4 ${fijas.planilla3_hoja4?'✅':'❌'}`;}
let currentKey=null;function actualizarPreviewNombre(){let n=document.getElementById('nombrePaciente').value.trim(),d=document.getElementById('nombrePreview');if(n){d.style.display='block';d.innerHTML='✅ BILOBA - '+n+'.pdf';document.getElementById('btnFinal').innerText='⬇️ DESCARGAR BILOBA - '+n+' - MAX 1,69MB';}else{d.style.display='none';}}
function renderEstado(){let html='';for(let k of ORDEN){let ex=k.startsWith('planilla3')?!!fijas[k]:!!dinamicos.find(x=>x.key===k);let est=ex?'✅':'❌';let cant=(posiciones[k]||[]).length;let extra=SOLO_FIRMAR.includes(k)?(cant?` - ${cant} firma`:` - Falta firma`):'';html+=`<div>${NOMBRES[k]} ${est}${extra}</div>`;}document.getElementById('ordenTodas').innerHTML=html;let soloFirmar=ORDEN.filter(k=>SOLO_FIRMAR.includes(k)&&(fijas[k]||dinamicos.find(d=>d.key===k)));let sel=document.getElementById('selDocVisor'),cur=sel.value;sel.innerHTML=soloFirmar.map(k=>`<option value="${k}">${NOMBRES[k]} ${(posiciones[k]||[]).length?' - OK':' - Falta'}</option>`).join('');if(cur)sel.value=cur;if(soloFirmar.length&&!currentKey){currentKey=soloFirmar[0];sel.value=currentKey;loadVisor(currentKey);}window._todos=ORDEN.filter(k=>k.startsWith('planilla3')?!!fijas[k]:!!dinamicos.find(d=>d.key===k));}
async function loadVisor(key){if(!key)return;currentKey=key;let by=null;if(fijas[key])by=b64ToU8(fijas[key]);else{let d=dinamicos.find(x=>x.key===key);if(!d)return;by=d.bytes?new Uint8Array(d.bytes):b64ToU8(d.b64);}try{let pdf=await pdfjsLib.getDocument({data:by.slice().buffer}).promise;let page=await pdf.getPage(pdf.numPages);let vp=page.getViewport({scale:1.5});scale=1.5;pageW=vp.width/scale;pageH=vp.height/scale;let cv=document.getElementById('pdfCanvas'),ctx=cv.getContext('2d');cv.width=vp.width;cv.height=vp.height;await page.render({canvasContext:ctx,viewport:vp}).promise;document.querySelectorAll('.firmaDrag').forEach(e=>e.remove());(posiciones[key]||[]).forEach((pos,idx)=>{if(!firmas[pos.firmaIdx])return;let w=pos.rw*pageW,h=w/2.8,x=pos.rx*pageW,y=pos.ry*pageH;let div=document.createElement('div');div.className='firmaDrag'+(selectedIdx===idx?' selected':'');div.style.left=(x*scale)+'px';div.style.top=((pageH-y-h)*scale)+'px';div.style.width=(w*scale)+'px';div.style.height=(h*scale)+'px';let img=document.createElement('img');img.src=firmas[pos.firmaIdx];div.appendChild(img);document.getElementById('wrap').appendChild(div);makeDrag(div,key,idx);});}catch(e){}}
function makeDrag(el,key,idx){let sx,sy,ox,oy,isDrag=false;function onMove(e){let cx=e.touches?e.touches[0].clientX:e.clientX,cy=e.touches?e.touches[0].clientY:e.clientY;let dx=cx-sx,dy=cy-sy;if(Math.abs(dx)>3||Math.abs(dy)>3)isDrag=true;if(isDrag){el.style.left=(ox+dx)+'px';el.style.top=(oy+dy)+'px';}}function onUp(e){document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);document.removeEventListener('touchmove',onMove);document.removeEventListener('touchend',onUp);if(isDrag){let p=posiciones[key][idx];let top=parseFloat(el.style.top)/scale,left=parseFloat(el.style.left)/scale,w=parseFloat(el.style.width)/scale;p.rx=left/pageW;p.ry=(pageH-top-(w/2.8))/pageH;p.rw=w/pageW;saveAll();}else{selectedIdx=idx;loadVisor(key);}isDrag=false;}function onDown(e){e.preventDefault();e.stopPropagation();let cx=e.touches?e.touches[0].clientX:e.clientX,cy=e.touches?e.touches[0].clientY:e.clientY;sx=cx;sy=cy;ox=parseFloat(el.style.left);oy=parseFloat(el.style.top);isDrag=false;document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);document.addEventListener('touchmove',onMove,{passive:false});document.addEventListener('touchend',onUp);}el.addEventListener('mousedown',onDown);el.addEventListener('touchstart',onDown,{passive:false});}
function addCentro(){if(!currentKey){alert('Selecciona doc');return;}if(!firmas[firmaActiva]){alert('Firma no cargada');return;}let w=parseInt(document.getElementById('rangeW').value),x=(pageW/2)-(w/2),y=(pageH/2)-(w/2.8/2);if(!posiciones[currentKey])posiciones[currentKey]=[];posiciones[currentKey].push({firmaIdx:firmaActiva,rx:x/pageW,ry:y/pageH,rw:w/pageW});selectedIdx=posiciones[currentKey].length-1;saveAll();renderEstado();loadVisor(currentKey);}function addP4(){if(!posiciones['p4'])posiciones['p4']=[];posiciones['p4'].push({firmaIdx:2,rx:0.055,ry:0.088,rw:0.32});currentKey='p4';document.getElementById('selDocVisor').value='p4';saveAll();renderEstado();selectedIdx=posiciones['p4'].length-1;loadVisor('p4');}
document.getElementById('btnAddCentro').addEventListener('click',addCentro);document.getElementById('btnP4Centro').addEventListener('click',addP4);
document.getElementById('btnLeft').addEventListener('click',()=>{if(selectedIdx===null)return;posiciones[currentKey][selectedIdx].rx-=0.008;saveAll();loadVisor(currentKey);});

document.getElementById('btnChica').addEventListener('click',()=>{if(selectedIdx===null)return;posiciones[currentKey][selectedIdx].rw*=0.9;saveAll();loadVisor(currentKey);});
document.getElementById('btnGrande').addEventListener('click',()=>{if(selectedIdx===null)return;posiciones[currentKey][selectedIdx].rw*=1.1;saveAll();loadVisor(currentKey);});
document.getElementById('btnBorrarUna').addEventListener('click',()=>{if(selectedIdx===null)return;posiciones[currentKey].splice(selectedIdx,1);selectedIdx=null;saveAll();loadVisor(currentKey);renderEstado();});
document.getElementById('rangeW').addEventListener('input',()=>document.getElementById('lblW').innerText=document.getElementById('rangeW').value+'px');
document.getElementById('pdfCanvas').addEventListener('click',e=>{if(!currentKey)return;if(e.target!==document.getElementById('pdfCanvas'))return;let w=parseInt(document.getElementById('rangeW').value),rect=e.target.getBoundingClientRect(),x=(e.clientX-rect.left)/scale,yTop=(e.clientY-rect.top)/scale,y=pageH-yTop-w/2.8,left=x-w/2;if(!posiciones[currentKey])posiciones[currentKey]=[];posiciones[currentKey].push({firmaIdx:firmaActiva,rx:left/pageW,ry:y/pageH,rw:w/pageW});selectedIdx=posiciones[currentKey].length-1;saveAll();renderEstado();loadVisor(currentKey);});
document.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('active'));b.classList.add('active');firmaActiva=parseInt(b.dataset.f);}));

async function cargarUno(file,key,sid){if(posiciones[key]){delete posiciones[key];selectedIdx=null;}document.getElementById(sid).innerText='Guardando...';let ab=await file.arrayBuffer(),by=new Uint8Array(ab);dinamicos=dinamicos.filter(d=>d.key!==key);dinamicos.push({key,bytes:by,b64:buf2b64(by),original:ab});document.getElementById(sid).innerText=file.name+' listo';currentKey=key;renderEstado();saveAll();await loadVisor(key);}
document.getElementById('inResumen').addEventListener('change',e=>{if(e.target.files[0])cargarUno(e.target.files[0],'resumen','stResumen');});document.getElementById('inAdmision').addEventListener('change',e=>{if(e.target.files[0])cargarUno(e.target.files[0],'admision','stAdmision');});document.getElementById('inIndicacion').addEventListener('change',e=>{if(e.target.files[0])cargarUno(e.target.files[0],'indicacion','stIndicacion');});document.getElementById('in4Pag').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;for(let k of ['p1','p2','p3','p4'])if(posiciones[k])delete posiciones[k];selectedIdx=null;document.getElementById('st4Pag').innerText='Cargando...';let ab=await file.arrayBuffer();const src=await PDFLib.PDFDocument.load(ab);dinamicos=dinamicos.filter(d=>!/^p\d+$/.test(d.key));for(let i=0;i<src.getPageCount();i++){let s=await PDFLib.PDFDocument.create();let [p]=await s.copyPages(src,[i]);s.addPage(p);let by=await s.save();dinamicos.push({key:`p${i+1}`,bytes:new Uint8Array(by),b64:buf2b64(by),originalPage:ab,pageIndex:i});}document.getElementById('st4Pag').innerText=file.name+' - 4 pags';renderEstado();saveAll();});
document.getElementById('nombrePaciente').addEventListener('input',()=>{let n=document.getElementById('nombrePaciente').value.trim();if(n!==ultimoNombre&&Object.keys(posiciones).length>0){if(ultimoNombre!==""&&n!==""&&n.length>3){posiciones={};selectedIdx=null;}}ultimoNombre=n;actualizarPreviewNombre();saveAll();});
document.getElementById('btnFinal').addEventListener('click',async()=>{
let nombre=document.getElementById('nombrePaciente').value.trim();if(!nombre){alert('Escribi nombre');return;}if(!window._todos||window._todos.length<1){alert('Carga PDF');return;}
// COMPRESION INTELIGENTE: busca la MAXIMA CALIDAD que entre en 1.69MB
const LIMITE=1.69;
let cal=0.92, esc=2.0, mejorOut=null, mejorMB=0, mejorCal=0;
document.getElementById('status').innerText=`🔄 Buscando la mejor calidad para ${LIMITE}MB...`;
while(cal>=0.40){
  const fin=await PDFLib.PDFDocument.create();
  for(let k of window._todos){
    let d=dinamicos.find(x=>x.key===k),by=null;
    if(fijas[k]){by=b64ToU8(fijas[k]);let comp=await compPag(by.buffer,0,cal,esc);by=new Uint8Array(comp);}
    else if(d){let orig=d.original||d.originalPage?(d.originalPage||d.original):d.bytes.buffer,idx=d.pageIndex!=null?d.pageIndex:0,isSingle=d.pageIndex!=null,comp=isSingle?await compPag(orig,idx,cal,esc):await compPdf(orig,cal,esc);by=new Uint8Array(comp);}

  cal-=0.03;

}else{

}
});cargarFijas();</script></body></html>
